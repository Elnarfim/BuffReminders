# git-cliff config — generates release notes from Conventional Commits.
#
# feat/fix/perf get their own sections; i18n collapses to a single Localization
# line; everything else lands in a catch-all Other Changes section. Leading
# gitmoji are stripped from each line; only the commit subject is shown (bodies
# are ignored). A conventional-commit scope, when present, renders as a bold
# "Scope: " lead-in (e.g. feat(soulstone) -> "**Soulstone:** ..."); scopeless
# subjects render bare. Sections are ordered via HTML-comment sort keys that the
# template strips before rendering. Within a section, scoped commits come first
# clustered and alphabetized by scope (so same-scope entries read together),
# then the scopeless ones; both keep commit (date) order as the tiebreaker.
#
# The alpha-folding and release range live in .github/workflows/release.yml
# (--ignore-tags + an explicit <last-stable>..HEAD range), NOT here, so every
# release shows all meaningful changes since the last stable, labeled with its
# own tag.

[changelog]
header = "# BuffReminders\n\n"
body = """
## [{{ version }}](https://github.com/zerbiniandrea/BuffReminders/tree/{{ version }}){% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}
{% if previous.version %}[Full Changelog](https://github.com/zerbiniandrea/BuffReminders/compare/{{ previous.version }}...{{ version }}) {% endif %}[Previous Releases](https://github.com/zerbiniandrea/BuffReminders/releases)
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last }}
{% if group is containing("Localization") %}
{%- set_global langs = "" %}
{%- for commit in commits %}
{%- if commit.scope and commit.scope not in langs %}{% set_global langs = langs ~ commit.scope ~ ", " %}{% endif %}
{%- endfor %}
- Updated translations{% if langs != "" %}: {{ langs | trim_end_matches(pat=", ") }}{% endif %}
{%- else %}{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}
- **{{ commit.scope | upper_first }}:** {{ commit.message }}
{%- endfor %}{% for commit in commits %}{% if not commit.scope %}
- {{ commit.message | upper_first }}
{%- endif %}{% endfor %}{% endif %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Strip leading gitmoji + variation selectors, then tidy whitespace.
commit_preprocessors = [
  { pattern = "[\\x{1F000}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{2190}-\\x{21FF}\\x{2300}-\\x{23FF}\\x{FE0F}\\x{200D}]", replace = "" },
  { pattern = "  +", replace = " " },
  { pattern = "^ +", replace = "" },
]

# HTML-comment sort keys order the sections; the template strips them so they
# never render. The final catch-all routes everything else to Other Changes.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New Features ✨" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes 🐛" },
  { message = "^perf", group = "<!-- 2 -->Performance ⚡️" },
  { message = "^i18n", group = "<!-- 3 -->Localization 🌐" },
  { message = ".*", group = "<!-- 4 -->Other Changes 🔧" },
]

filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
